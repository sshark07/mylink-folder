<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="나만의 관심사와 자주 방문하는 링크를 한곳에 모은 마이링크 페이지입니다.">
<meta property="og:title" content="MyLink | 나만의 링크 공간">
<meta property="og:description" content="일상, 학습, 새로운 도전을 연결하는 나만의 링크 공간">
<title>MyLink | 나만의 링크 공간</title>
<style>
:root{--blue:#5b5fc7;--ink:#232746;--muted:#666d86;--line:#e3e5ef;--bg:#f4f4fa;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#e5e5fb 0,transparent 470px),var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);line-height:1.55}button,input{font:inherit}button{cursor:pointer}a{color:inherit}main{max-width:510px;margin:0 auto;padding:30px 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.5px}.mark{display:grid;place-items:center;background:var(--blue);color:white;border-radius:10px;width:32px;height:32px}.quiet{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:8px 12px;font-size:13px;font-weight:700}.profile{text-align:center;padding:16px 0 25px}.avatar{display:grid;place-items:center;width:88px;height:88px;margin:0 auto 16px;background:linear-gradient(145deg,#777be0,#4145a4);color:#fff;border-radius:28px;box-shadow:0 9px 24px #5b5fc72d;font-size:29px;font-weight:800;letter-spacing:-2px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--blue)}h1{font-size:30px;letter-spacing:-1.4px;margin:7px 0 5px}.profile p{margin:0;color:var(--muted);font-size:14px}.section{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.section h2{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}.links{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 12px #27264a05;overflow:hidden}.link{display:flex;align-items:center;gap:13px;padding:15px;text-decoration:none;min-height:76px;transition:background .2s}.link:hover{background:#f1f1fd}.icon{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:13px;background:#eeeefd;color:var(--blue);font-size:19px;font-weight:800}.info{flex:1;min-width:0}.info strong,.info small{display:block;overflow-wrap:anywhere}.info small{color:var(--muted);font-size:12px;margin-top:3px}.arrow{font-size:20px;color:var(--muted)}.actions{display:flex;gap:6px;padding:0 13px 12px;align-items:center}.actions span{margin-right:auto;font-size:12px;color:var(--muted)}.actions button{border:0;background:#f2f2f9;color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12px}.actions .remove{color:#a33b4c}.panel{border:1px solid var(--line);background:#fff;border-radius:16px;padding:17px;margin-top:14px}.panel h2{font-size:15px;margin:0 0 12px}.panel label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}.panel input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);background:#fafaff}.primary{border:0;border-radius:10px;background:var(--blue);color:white;font-weight:700;padding:11px 14px}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions .primary{flex:1}.notice{font-size:12px;color:var(--muted);margin:10px 0 0}.status{min-height:22px;font-size:12px;color:var(--blue);text-align:center;margin:12px 0 0}.empty{text-align:center;padding:25px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}footer b{color:var(--blue)}[hidden]{display:none!important}:focus-visible{outline:3px solid #8d91ef;outline-offset:3px}@media(max-width:360px){main{padding:20px 13px}h1{font-size:25px}}
</style>
</head>
<body><main>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">↗</span> MyLink</div><button class="quiet" id="manage" type="button" aria-expanded="false">링크 관리</button></header>
<section class="profile" aria-label="프로필"><div class="avatar" aria-hidden="true">ML</div><div class="eyebrow">MY PERSONAL LINKS</div><h1>나만의 링크 공간</h1><p>배우고, 기록하고, 새로운 가능성을 연결합니다.</p></section>
<div class="section"><h2>나의 링크</h2><span class="count" id="count"></span></div>
<div class="links" id="links"></div>
<section class="panel" id="panel" hidden><h2 id="form-title">새 링크 추가</h2><form id="form"><label for="name">링크 제목</label><input id="name" maxlength="70" required placeholder="예: 나의 블로그"><label for="url">웹사이트 주소</label><input id="url" type="url" required placeholder="https://example.com"><label for="desc">한 줄 설명 (선택)</label><input id="desc" maxlength="120" placeholder="링크에 대한 간단한 소개"><div class="form-actions"><button type="submit" class="primary" id="save">링크 추가</button><button type="button" class="quiet" id="cancel" hidden>취소</button></div></form><p class="notice">추가·수정·삭제 및 클릭 수는 현재 브라우저에만 저장됩니다. 다른 방문자에게는 기본 링크가 표시됩니다.</p></section>
<p class="status" id="status" role="status"></p><footer><b>MyLink</b> · 바이브코딩 프로젝트</footer>
</main>
<script>
'use strict';
const key='mylink-course-v1';
const defaults=[{id:'a',name:'GitHub',url:'https://github.com/',desc:'코드와 프로젝트를 관리하는 공간',icon:'GH',clicks:0},{id:'b',name:'YouTube',url:'https://www.youtube.com/',desc:'새로운 지식과 콘텐츠 탐색',icon:'▶',clicks:0},{id:'c',name:'Notion',url:'https://www.notion.so/',desc:'학습, 아이디어, 일정 정리',icon:'N',clicks:0},{id:'d',name:'Google Scholar',url:'https://scholar.google.com/',desc:'학술 자료와 연구 탐색',icon:'G',clicks:0}];
const $=id=>document.getElementById(id);
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function load(){try{const stored=JSON.parse(localStorage.getItem(key));if(Array.isArray(stored))return stored.filter(x=>x&&typeof x.name==='string'&&safeUrl(x.url));}catch{}return defaults.map(x=>({...x}));}
let links=load(), editing=null, managing=false;
function tell(s){$('status').textContent=s;}
function persist(){try{localStorage.setItem(key,JSON.stringify(links));return true;}catch{return false;}}
function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n;}
function render(){const box=$('links');box.replaceChildren();$('count').textContent=links.length+'개의 링크';if(!links.length)box.append(el('div','empty','아직 등록된 링크가 없습니다.'));for(const item of links){const card=el('article','item');const a=el('a','link');a.href=safeUrl(item.url);a.target='_blank';a.rel='noopener noreferrer';const icon=el('span','icon',item.icon||'↗');icon.setAttribute('aria-hidden','true');const info=el('div','info');info.append(el('strong','',item.name),el('small','',item.desc||new URL(item.url).hostname));const arrow=el('span','arrow','↗');arrow.setAttribute('aria-hidden','true');a.append(icon,info,arrow);a.addEventListener('click',()=>{item.clicks=(Number(item.clicks)||0)+1;persist();const counter=card.querySelector('.actions span');if(counter)counter.textContent='클릭 '+item.clicks+'회';});card.append(a);if(managing){const actions=el('div','actions');actions.append(el('span','','클릭 '+(item.clicks||0)+'회'));const edit=el('button','','수정');edit.type='button';edit.addEventListener('click',()=>{editing=item.id;$('name').value=item.name;$('url').value=item.url;$('desc').value=item.desc||'';$('form-title').textContent='링크 수정';$('save').textContent='수정 저장';$('cancel').hidden=false;$('name').focus();});const del=el('button','remove','삭제');del.type='button';del.addEventListener('click',()=>{if(!confirm('이 링크를 삭제할까요?'))return;links=links.filter(x=>x.id!==item.id);if(editing===item.id)resetForm();tell(persist()?'링크를 삭제했습니다.':'삭제했습니다. 새로고침하면 복구될 수 있습니다.');render();});actions.append(edit,del);card.append(actions);}box.append(card);}}
function resetForm(){editing=null;$('form').reset();$('form-title').textContent='새 링크 추가';$('save').textContent='링크 추가';$('cancel').hidden=true;}
$('manage').addEventListener('click',()=>{managing=!managing;$('manage').setAttribute('aria-expanded',String(managing));$('manage').textContent=managing?'관리 닫기':'링크 관리';$('panel').hidden=!managing;if(!managing)resetForm();tell('');render();});
$('cancel').addEventListener('click',resetForm);
$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),url=safeUrl($('url').value.trim()),desc=$('desc').value.trim();if(!name||!url){tell('제목과 올바른 http 또는 https 주소를 입력해 주세요.');return;}const updating=editing!==null;if(updating){links=links.map(x=>x.id===editing?{...x,name,url,desc}:x);}else{links.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,url,desc,icon:'↗',clicks:0});}const ok=persist();resetForm();render();tell((updating?'수정':'추가')+'했습니다.'+(ok?'':' 브라우저 저장을 사용할 수 없습니다.'));});
render();
</script></body></html>
